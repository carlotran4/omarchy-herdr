name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate manifest
        run: |
          jq -e . manifest.json >/dev/null
          test "$(jq -r .schemaVersion manifest.json)" = 1
          test "$(jq -r .id manifest.json)" = carlotran4.herdr
          test -f "$(jq -r .entryPoints.barWidget manifest.json)"
          if find . -path ./.git -prune -o -type l -print -quit | grep -q .; then
            echo "Plugin repositories may not contain symlinks" >&2
            exit 1
          fi
      - name: Test model logic
        run: node --test tests/herdr.test.mjs
      - name: Validate helper scripts
        run: bash -n scripts/focus-herdr-window
